<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKILLIBLOCKS — Área do Professor · Skilliu</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Urbanist:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- ══ NAV ÚNICA (logo + turmas na mesma barra) ══ -->
<nav class="main-nav">
  <div class="logo">
    <div class="logo-name"><span class="logo-skill">Skill</span><span class="logo-iu">iu</span></div>
    <div class="logo-sub">Steam Education</div>
  </div>
  <div class="turma-bar" id="turmaBar"></div>
</nav>

<!-- ══ TELA 1 — HOME (hero + carrossel de aulas) ══ -->
<main id="viewHome">
  <section class="sb-hero">
    <span class="sb-eyebrow"><span class="dot"></span>Área do Professor</span>
    <div class="sb-logo"><span class="sk">SKILLI</span><span class="bl">BLOCKS</span></div>
    <span class="sb-turma-tag"><i class="fa-solid fa-graduation-cap"></i> Você está em: <span id="turmaTagNome">1º Ano</span></span>
  </section>

  <section class="aulas-wrap">
    <div class="carousel">
      <button class="car-arrow" id="carPrev" aria-label="Aula anterior"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="aulas-track" id="aulasTrack"></div>
      <button class="car-arrow" id="carNext" aria-label="Próxima aula"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </section>

  </main>

<!-- ══ TELA 2 — VISUALIZADOR (aberto ao clicar numa aula) ══ -->
<main id="viewViewer" hidden>
  <nav class="viewer-bar">
    <div class="vb-left">
      <button class="vb-back" id="btnVoltarAulas"><i class="fa-solid fa-house"></i> Início</button>
      <div class="vb-title">
        <span class="t-turma" id="vbTurmaNome">1º Ano</span>
        <span class="t-aula" id="vbAulaTitle">Carregando…</span>
      </div>
    </div>
    <div class="vb-pag">
      <button class="vb-back-mini" id="btnVoltarMini" aria-label="Voltar ao início"><i class="fa-solid fa-house"></i></button>
      <span class="vb-aula-num" id="vbAulaNum">Aula 1</span>
      <button id="vbPrev" aria-label="Página anterior"><i class="fa-solid fa-chevron-left"></i></button>
      <span><span id="vbPagAtual">1</span> / <span id="vbPagTotal">1</span></span>
      <button id="vbNext" aria-label="Próxima página"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </nav>
  <div class="viewer-scroll" id="viewerScroll"></div>
</main>

<script src="script.js"></script>
</body>
</html>
