<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skilliu — Painel de Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Urbanist:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="painel.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-pendente">

<div class="auth-loading" id="authLoading">
  <div class="auth-loading-badge">S</div>
  <i class="fa-solid fa-spinner fa-spin"></i>
</div>

<div class="app-shell">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-logo" id="sbLogo" title="Identidade Skilliu">
        <div class="sb-logo-badge">S</div>
        <div class="sb-logo-text">
          <b>Skilliu</b>
          <span>Steam Education</span>
        </div>
      </div>
      <button class="sb-toggle" id="sbToggle" aria-label="Recolher menu">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
    </div>

    <div class="sb-scroll">
      <span class="sb-group-label">Gestão</span>
      <nav class="sb-nav">
        <button class="sb-item active" data-page="dashboard"><i class="fa-solid fa-house"></i><span>Dashboard</span></button>
        <button class="sb-item" data-page="time"><i class="fa-solid fa-people-group"></i><span>Time</span></button>
        <button class="sb-item" data-page="financeiro"><i class="fa-solid fa-sack-dollar"></i><span>Financeiro</span></button>
        <button class="sb-item" data-page="agenda"><i class="fa-solid fa-calendar-days"></i><span>Agenda</span></button>
      </nav>

      <span class="sb-group-label">Comunidade Skilliu</span>
      <nav class="sb-nav">
        <button class="sb-item" data-page="comunidade"><i class="fa-solid fa-comments"></i><span>Comunidade</span></button>
        <button class="sb-item" data-page="produtos"><i class="fa-solid fa-box-open"></i><span>Produtos</span></button>
        <button class="sb-item" data-page="biblioteca"><i class="fa-solid fa-book-open"></i><span>Biblioteca</span></button>
        <button class="sb-item" data-page="radar"><i class="fa-solid fa-satellite-dish"></i><span>Radar</span></button>
        <button class="sb-item" data-page="formacao"><i class="fa-solid fa-graduation-cap"></i><span>Formação</span></button>
        <button class="sb-item" data-page="workshop"><i class="fa-solid fa-chalkboard-user"></i><span>Workshop</span></button>
        <button class="sb-item" data-page="palestras"><i class="fa-solid fa-microphone"></i><span>Palestras</span></button>
        <button class="sb-item" data-page="contatos"><i class="fa-solid fa-address-book"></i><span>Contatos</span></button>
      </nav>

      <div class="sb-divider"></div>
      <nav class="sb-nav">
        <button class="sb-item" data-page="configuracoes"><i class="fa-solid fa-gear"></i><span>Configurações</span></button>
        <button class="sb-item sb-item-logout" data-page="sair"><i class="fa-solid fa-right-from-bracket"></i><span>Sair</span></button>
      </nav>
    </div>
  </aside>

  <!-- ══ CONTEÚDO ══ -->
  <div class="main">
    <header class="topbar">
      <button class="tb-hamburger" id="tbHamburger" aria-label="Abrir menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="topbar-title" id="pageTitle">Dashboard</div>
      <div class="topbar-right">
        <div class="tb-bell" id="tbBell"><i class="fa-solid fa-bell"></i><span class="dot"></span></div>
        <div class="tb-user" id="tbUser">
          <div class="tb-avatar">A</div>
          <span>Olá, <strong>Admin</strong></span>
        </div>
      </div>
    </header>

    <main class="content" id="pageContent"></main>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ══ MODAL GENÉRICO ══ -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- ══ PAINEL LATERAL (Minha conta) ══ -->
<div class="side-backdrop" id="sideBackdrop">
  <div class="side-panel" id="sidePanel"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="painel.js"></script>
</body>
</html>
